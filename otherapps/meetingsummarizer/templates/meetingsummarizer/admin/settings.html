{% extends 'meetingsummarizer/base.html' %}
{% block title %}Admin Settings – MeetSummarizer{% endblock %}
{% block content %}
<div class="d-flex align-items-center gap-2 mb-4">
  <a href="{{ url_for('meetingsummarizer.admin_dashboard') }}" class="btn btn-sm btn-outline-secondary"><i class="bi bi-arrow-left"></i></a>
  <h4 class="fw-bold mb-0">Admin Settings</h4>
</div>
<div class="row g-4">
  <div class="col-lg-7">
    <div class="card p-4 mb-4">
      <h5 class="fw-semibold mb-3"><i class="bi bi-cpu me-2" style="color:#7C3AED"></i>API Settings</h5>
      <form method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
        <input type="hidden" name="action" value="api"/>
        <div class="mb-3">
          <label class="form-label fw-medium">Groq API Key</label>
          <input type="password" class="form-control" name="groq_api_key" value="{{ settings['groq_api_key'] }}" placeholder="gsk_…"/>
          <div class="form-text">Required for transcription and summarization.</div>
        </div>
        <div class="mb-3">
          <label class="form-label fw-medium">Whisper Model (transcription)</label>
          <select class="form-select" name="whisper_model">
            {% for m in ['whisper-large-v3','whisper-large-v3-turbo'] %}
            <option value="{{ m }}" {% if settings['whisper_model']==m %}selected{% endif %}>{{ m }}</option>
            {% endfor %}
          </select>
        </div>
        <div class="mb-3">
          <label class="form-label fw-medium">Summary Model</label>
          <select class="form-select" name="summary_model">
            {% for m in ['openai/gpt-oss-20b','llama-3.3-70b-versatile','mixtral-8x7b-32768'] %}
            <option value="{{ m }}" {% if settings['summary_model']==m %}selected{% endif %}>{{ m }}</option>
            {% endfor %}
          </select>
        </div>
        <div class="mb-3">
          <label class="form-label fw-medium">Summary Style</label>
          <select class="form-select" name="summary_style">
            {% for s in ['bullet-points','paragraph','detailed'] %}
            <option value="{{ s }}" {% if settings['summary_style']==s %}selected{% endif %}>{{ s.replace('-',' ').title() }}</option>
            {% endfor %}
          </select>
        </div>
        <button type="submit" class="btn btn-brand">Save Settings</button>
      </form>
    </div>
  </div>
  <div class="col-lg-5">
    <div class="card p-4">
      <h5 class="fw-semibold mb-3"><i class="bi bi-key me-2 text-warning"></i>Change Password</h5>
      <form method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
        <input type="hidden" name="action" value="password"/>
        <div class="mb-3">
          <label class="form-label fw-medium">Current Password</label>
          <input type="password" class="form-control" name="current_password" required/>
        </div>
        <div class="mb-3">
          <label class="form-label fw-medium">New Password</label>
          <input type="password" class="form-control" name="new_password" required minlength="6"/>
        </div>
        <div class="mb-3">
          <label class="form-label fw-medium">Confirm Password</label>
          <input type="password" class="form-control" name="confirm_password" required/>
        </div>
        <button type="submit" class="btn btn-warning">Update Password</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
