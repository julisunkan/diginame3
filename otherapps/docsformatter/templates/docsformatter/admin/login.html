{% extends 'docsformatter/base.html' %}
{% block title %}Admin Login – DocFormatter{% endblock %}
{% block content %}
<div class="row justify-content-center mt-4">
  <div class="col-md-5">
    <div class="card p-4">
      <div class="text-center mb-4">
        <i class="bi bi-shield-lock display-4 text-primary"></i>
        <h4 class="fw-bold mt-2">Admin Login</h4>
        <p class="text-muted small">DocFormatter Administration</p>
      </div>
      <form method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
        <div class="mb-3">
          <label class="form-label fw-medium">Username</label>
          <input type="text" class="form-control" name="username" required autofocus/>
        </div>
        <div class="mb-4">
          <label class="form-label fw-medium">Password</label>
          <input type="password" class="form-control" name="password" required/>
        </div>
        <div class="d-grid">
          <button type="submit" class="btn btn-brand btn-lg">Sign In</button>
        </div>
      </form>
      <div class="text-center mt-3">
        <small class="text-muted">Default: admin / admin123</small>
      </div>
    </div>
  </div>
</div>
{% endblock %}
