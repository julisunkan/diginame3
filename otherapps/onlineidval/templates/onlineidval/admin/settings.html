{% extends 'onlineidval/base.html' %}
{% block title %}Admin Settings – ID Validator{% endblock %}
{% block content %}
<div class="d-flex align-items-center gap-2 mb-4">
  <a href="{{ url_for('onlineidval.admin_dashboard') }}" class="btn btn-sm btn-outline-secondary"><i class="bi bi-arrow-left"></i></a>
  <h4 class="fw-bold mb-0">Admin Settings</h4>
</div>
<div class="row g-4">
  <div class="col-lg-7">
    <div class="card p-4 mb-4">
      <h5 class="fw-semibold mb-3"><i class="bi bi-cpu me-2 text-success"></i>API Settings</h5>
      <form method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
        <input type="hidden" name="action" value="api"/>
        <div class="mb-3">
          <label class="form-label fw-medium">Groq API Key</label>
          <input type="password" class="form-control" name="groq_api_key" value="{{ settings['groq_api_key'] }}" placeholder="gsk_…"/>
          <div class="form-text">Required for ID analysis. Get yours at <a href="https://console.groq.com" target="_blank">console.groq.com</a></div>
        </div>
        <div class="mb-3">
          <label class="form-label fw-medium">Vision Model</label>
          <input type="text" class="form-control" name="vision_model" value="{{ settings['vision_model'] }}"
                 placeholder="qwen/qwen3.6-27b"/>
          <div class="form-text">Must support vision/image input.</div>
        </div>
        <div class="mb-3">
          <label class="form-label fw-medium">Validation Strictness</label>
          <select class="form-select" name="strictness">
            {% for s in ['lenient','standard','strict'] %}
            <option value="{{ s }}" {% if settings['strictness']==s %}selected{% endif %}>{{ s.title() }}</option>
            {% endfor %}
          </select>
        </div>
        <button type="submit" class="btn btn-brand">Save Settings</button>
      </form>
    </div>
  </div>
  <div class="col-lg-5">
    <div class="card p-4">
      <h5 class="fw-semibold mb-3"><i class="bi bi-key me-2 text-warning"></i>Change Password</h5>
      <form method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
        <input type="hidden" name="action" value="password"/>
        <div class="mb-3"><label class="form-label fw-medium">Current Password</label>
          <input type="password" class="form-control" name="current_password" required/></div>
        <div class="mb-3"><label class="form-label fw-medium">New Password</label>
          <input type="password" class="form-control" name="new_password" required minlength="6"/></div>
        <div class="mb-3"><label class="form-label fw-medium">Confirm Password</label>
          <input type="password" class="form-control" name="confirm_password" required/></div>
        <button type="submit" class="btn btn-warning">Update Password</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
