{% extends 'meetingsummarizer/base.html' %}
{% block title %}Settings – MeetSummarizer{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-7">
    <div class="d-flex align-items-center gap-2 mb-4">
      <a href="{{ url_for('meetingsummarizer.index') }}" class="btn btn-sm btn-outline-secondary"><i class="bi bi-arrow-left"></i></a>
      <h4 class="fw-bold mb-0">Settings</h4>
    </div>
    <div class="card p-4">
      <h5 class="fw-semibold mb-2"><i class="bi bi-key me-2" style="color:#7C3AED"></i>Groq API</h5>
      <p class="text-muted small">Add your Groq API key to transcribe and summarize meetings. This page only changes the Groq API key.</p>
      <form method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
        <label class="form-label fw-medium" for="groq_api_key">Groq API Key</label>
        <input id="groq_api_key" type="password" class="form-control" name="groq_api_key"
               value="{{ groq_api_key }}" placeholder="gsk_…" autocomplete="off"/>
        <div class="form-text mb-3">Get your key at <a href="https://console.groq.com" target="_blank" rel="noopener">console.groq.com</a>.</div>
        <button type="submit" class="btn btn-brand"><i class="bi bi-check2 me-1"></i>Save API Key</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
